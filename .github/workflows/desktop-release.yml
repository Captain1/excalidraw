name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example v0.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Desktop Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            build-command: yarn desktop:build:linux
            asset-prefix: Excalidraw-Linux
            artifact-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - name: windows
            os: windows-latest
            build-command: yarn desktop:build:win
            asset-prefix: Excalidraw-Windows
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macos-universal
            os: macos-latest
            build-command: yarn desktop:build:mac
            asset-prefix: Excalidraw-macOS-universal
            artifact-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm \
            wget \
            libfuse2
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn test:typecheck

      - name: Build desktop app
        run: ${{ matrix.build-command }}

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          case "${{ matrix.name }}" in
            linux)
              find src-tauri/target/release/bundle -type f \( \
                -name "*.AppImage" -o \
                -name "*.deb" -o \
                -name "*.rpm" \
              \) -print0 | while IFS= read -r -d '' artifact; do
                cp "$artifact" "release-assets/${{ matrix.asset-prefix }}-${version}-$(basename "$artifact")"
              done
              ;;
            windows)
              find src-tauri/target/release/bundle -type f \( \
                -name "*.exe" -o \
                -name "*.msi" \
              \) -print0 | while IFS= read -r -d '' artifact; do
                cp "$artifact" "release-assets/${{ matrix.asset-prefix }}-${version}-$(basename "$artifact")"
              done
              ;;
            macos-universal)
              find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name "*.dmg" -print0 | while IFS= read -r -d '' artifact; do
                cp "$artifact" "release-assets/${{ matrix.asset-prefix }}-${version}-$(basename "$artifact")"
              done
              app_path=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -1 || true)
              if [ -z "$app_path" ]; then
                echo "No macOS .app bundle found" >&2
                exit 1
              fi
              ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/${{ matrix.asset-prefix }}-${version}.zip"
              ;;
          esac

          ls -la release-assets

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Desktop Release
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Excalidraw Desktop ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: true
          files: release-assets/*
          body: |
            ## Desktop builds

            - Linux: AppImage, deb, and rpm packages
            - macOS: universal Apple Silicon + Intel dmg and app zip
            - Windows: NSIS exe and MSI installers

            macOS builds use ad-hoc signing, so users may need to approve the app once in System Settings > Privacy & Security.
