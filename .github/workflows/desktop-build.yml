name: Desktop Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - ".github/workflows/desktop-release.yml"
      - "src-tauri/**"
      - "excalidraw-app/**"
      - "packages/**"
      - "public/**"
      - "package.json"
      - "yarn.lock"
      - "tsconfig.json"
      - "vitest.config.mts"

jobs:
  desktop-build:
    name: Desktop Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            build-command: yarn desktop:build:linux
            artifact-name: desktop-linux
            artifact-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: windows-latest
            build-command: yarn desktop:build:win
            artifact-name: desktop-windows
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            build-command: yarn desktop:build:mac
            artifact-name: desktop-macos-universal
            artifact-path: |
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm \
            wget \
            libfuse2
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn test:typecheck

      - name: Build desktop app
        run: ${{ matrix.build-command }}

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7
